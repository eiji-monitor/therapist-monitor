<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Therapist Monitor</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;margin:0;color:#111827}
.wrap{max-width:430px;margin:auto;padding:24px 18px}.card{background:white;border-radius:20px;padding:24px;box-shadow:0 4px 20px #0001}
h1{font-size:24px;margin:0 0 24px}.label{font-size:14px;color:#6b7280}
.status{font-size:30px;font-weight:700;margin:8px 0 22px}
button{width:100%;padding:16px;border:0;border-radius:14px;font-size:18px;font-weight:700;margin-top:10px}
.on{background:#111827;color:white}.off{background:#e5e7eb;color:#111827}.test{background:#dbeafe;color:#1e3a8a}
.log{margin-top:22px;padding-top:16px;border-top:1px solid #e5e7eb;font-size:13px;color:#6b7280;line-height:1.7}
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>Therapist Monitor</h1>
<div class="label">現在の状態</div><div id="status" class="status"></div>
<button id="toggle"></button><button id="notify" class="test">通知テスト</button>
<div class="log"><div>最終操作：<span id="last">まだありません</span></div>
<div>※ 試作版：まだPCとの通信は行いません。</div></div>
</div></div>
<script>
const status=document.getElementById("status"),toggle=document.getElementById("toggle");
const notify=document.getElementById("notify"),last=document.getElementById("last");
let monitoring=localStorage.getItem("monitoring")!=="off";
function render(){status.textContent=monitoring?"🟢 監視中":"🔴 停止中";toggle.textContent=monitoring?"監視 OFF":"監視 ON";toggle.className=monitoring?"off":"on";}
function stamp(){last.textContent=new Date().toLocaleString("ja-JP");}
toggle.onclick=()=>{monitoring=!monitoring;localStorage.setItem("monitoring",monitoring?"on":"off");render();stamp();};
notify.onclick=async()=>{
 if(!("Notification"in window)){alert("この環境では通知を利用できません。");return;}
 if(Notification.permission==="default") await Notification.requestPermission();
 if(Notification.permission==="granted"){new Notification("Therapist Monitor",{body:"これは通知機能のテストです。",icon:"icon-192.png"});stamp();}
 else alert("通知が許可されていません。");
};
render();
if("serviceWorker"in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body></html>
