<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest"><title>Therapist Monitor</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:20px;background:#f6f7f9}main{max-width:620px;margin:auto;background:white;padding:20px;border-radius:16px}button{width:100%;padding:15px;margin:8px 0;border:0;border-radius:12px;font-size:17px;background:#111827;color:white}#status{white-space:pre-wrap;background:#eef2f7;padding:12px;border-radius:10px;min-height:100px;font-size:14px}</style>
</head><body><main>
<h2>Therapist Monitor</h2><p>iPhone Web Push 診断版</p>
<button id="pushBtn">① プッシュ通知を登録</button>
<button id="testBtn">② ローカル通知テスト</button>
<button id="copyBtn">③ 登録情報をコピー</button>
<h3>診断結果</h3><div id="status">ページを読み込みました。</div>
<script>
const KEY="BJOfQEQsoQ-jgRyVXzNqtleFFt-Wl9_RKIBQg7Epo9Q3POq__D0zz9WzPJ_Fb-G_o6ESOAyRbHcHcaXYtgkJHAI";
const S=document.getElementById("status");
function log(x){S.textContent+="\n"+x}
function keyBytes(s){const p="=".repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))}
async function regPush(){
 S.textContent="ボタンが押されました。登録処理を開始します。";
 try{
  log("standalone表示: "+(matchMedia("(display-mode: standalone)").matches?"YES":"NO"));
  log("Notification API: "+("Notification"in window?"YES":"NO"));
  log("Service Worker: "+("serviceWorker"in navigator?"YES":"NO"));
  log("PushManager(window): "+("pushManager"in window?"YES":"NO"));
  if(!("Notification"in window))throw Error("Notification APIがありません。");
  if(!("serviceWorker"in navigator))throw Error("Service Worker APIがありません。");
  log("通知許可を確認します…");
  let p=Notification.permission; log("現在の通知許可: "+p);
  if(p==="default"){p=await Notification.requestPermission();log("通知許可の結果: "+p)}
  if(p!=="granted")throw Error("通知許可がgrantedではありません: "+p);
  const r=await navigator.serviceWorker.register("./sw.js",{scope:"./"});
  await navigator.serviceWorker.ready; log("Service Worker: OK");
  let sub=await r.pushManager.getSubscription();
  if(!sub){log("PushSubscriptionを作成します…");sub=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:keyBytes(KEY)})}
  localStorage.setItem("pushSubscription",JSON.stringify(sub));
  log("★ プッシュ通知の登録に成功しました！");
 }catch(e){log("ERROR: "+(e&&e.message?e.message:String(e)))}
}
async function localTest(){
 S.textContent="ローカル通知テストを開始します。";
 try{if(!("Notification"in window))throw Error("Notification APIがありません。");let p=Notification.permission;if(p==="default")p=await Notification.requestPermission();if(p!=="granted")throw Error("通知許可がありません: "+p);new Notification("Therapist Monitor",{body:"ローカル通知テストです。"});log("ローカル通知を発行しました。")}catch(e){log("ERROR: "+(e&&e.message?e.message:String(e)))}
}
function copySub(){const x=localStorage.getItem("pushSubscription");if(!x){log("まだPush登録情報がありません。①を先に押してください。");return}navigator.clipboard.writeText(x).then(()=>log("登録情報をコピーしました。"),e=>log("コピー失敗: "+e))}
pushBtn.onclick=regPush;testBtn.onclick=localTest;copyBtn.onclick=copySub;
log("URL: "+location.href);log("画面読み込み完了。");
</script></main></body></html>
