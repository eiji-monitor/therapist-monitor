<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest"><title>Therapist Monitor</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:20px;background:#f6f7f9}main{max-width:620px;margin:auto;background:white;padding:20px;border-radius:16px}button{width:100%;padding:15px;margin:8px 0;border:0;border-radius:12px;font-size:17px;background:#111827;color:white}#status{white-space:pre-wrap;background:#eef2f7;padding:12px;border-radius:10px;min-height:100px;font-size:14px}</style>
</head><body><main>
<h2>Therapist Monitor</h2>
<p>iPhone Web Push / 監視設定</p>
<div style="padding:14px;margin:12px 0;background:#eef2f7;border-radius:12px">
  <div style="font-size:15px;margin-bottom:8px"><b>監視状態</b></div>
  <button id="monitorBtn" style="margin:0">読み込み中…</button>
  <div id="monitorStatus" style="font-size:14px;margin-top:8px">Firebaseの設定を読み込んでいます。</div>
</div>
<button id="pushBtn">① プッシュ通知を登録</button>
<button id="testBtn">② ローカル通知テスト</button>
<button id="copyBtn">③ 登録情報をコピー</button>
<h3>診断結果</h3><div id="status">ページを読み込みました。</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import { getDatabase, ref, get, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDeXKftF2-7yBRSJhIOP6kLd9mq2A4movU",
    authDomain: "therapist-monitor.firebaseapp.com",
    databaseURL: "https://therapist-monitor-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "therapist-monitor",
    storageBucket: "therapist-monitor.firebasestorage.app",
    messagingSenderId: "171637749913",
    appId: "1:171637749913:web:23066401df0c2482892008",
    measurementId: "G-RDF44SBPR8"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const auth = getAuth(firebaseApp);
  const db = getDatabase(firebaseApp);

  signInAnonymously(auth).catch((e) => {
    console.error("Firebase匿名認証エラー:", e);
    const s = document.getElementById("status");
    if (s) s.textContent += "\nFirebase匿名認証エラー: " + (e.message || e);
  });

  let currentUser = null;
  let monitoring = false;

  function renderMonitorButton() {
    const btn = document.getElementById("monitorBtn");
    const st = document.getElementById("monitorStatus");
    if (!btn || !st) return;
    btn.textContent = monitoring ? "監視 ON（タップでOFF）" : "監視 OFF（タップでON）";
    btn.style.background = monitoring ? "#166534" : "#6b7280";
    st.textContent = monitoring
      ? "現在：監視ON"
      : "現在：監視OFF";
  }

  async function loadMonitoringSetting(user) {
    const snap = await get(ref(db, "control/" + user.uid));
    if (snap.exists() && typeof snap.val().monitoring === "boolean") {
      monitoring = snap.val().monitoring;
    } else {
      monitoring = false;
    }
    renderMonitorButton();
  }

  async function toggleMonitoring() {
    if (!currentUser) {
      log("Firebase認証がまだ完了していません。");
      return;
    }
    monitoring = !monitoring;
    renderMonitorButton();
    try {
      await set(ref(db, "control/" + currentUser.uid), {
        monitoring: monitoring,
        updatedAt: serverTimestamp()
      });
      log("監視設定をFirebaseに保存しました: " + (monitoring ? "ON" : "OFF"));
    } catch (e) {
      monitoring = !monitoring;
      renderMonitorButton();
      log("監視設定の保存エラー: " + (e && e.message ? e.message : e));
    }
  }

  onAuthStateChanged(auth, async (user) => {
    const s = document.getElementById("status");
    if (!s) return;
    if (user) {
      currentUser = user;
      s.textContent += "\nFirebase匿名認証: OK";
      s.textContent += "\nFirebase UID: " + user.uid;
      try {
        await loadMonitoringSetting(user);
        s.textContent += "\n監視設定の読み込み: OK";
      } catch (e) {
        s.textContent += "\n監視設定の読み込みエラー: " + (e.message || e);
      }
    }
  });

  document.getElementById("monitorBtn").addEventListener("click", toggleMonitoring);
  renderMonitorButton();
</script>

<script>
const KEY="BJOfQEQsoQ-jgRyVXzNqtleFFt-Wl9_RKIBQg7Epo9Q3POq__D0zz9WzPJ_Fb-G_o6ESOAyRbHcHcaXYtgkJHAI";
const S=document.getElementById("status");
function log(x){S.textContent+="\n"+x}
function keyBytes(s){const p="=".repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))}
async function regPush(){
 S.textContent="ボタンが押されました。登録処理を開始します。";
 try{
  log("standalone表示: "+(matchMedia("(display-mode: standalone)").matches?"YES":"NO"));
  log("Notification API: "+("Notification"in window?"YES":"NO"));
  log("Service Worker: "+("serviceWorker"in navigator?"YES":"NO"));
  log("PushManager(window): "+("pushManager"in window?"YES":"NO"));
  if(!("Notification"in window))throw Error("Notification APIがありません。");
  if(!("serviceWorker"in navigator))throw Error("Service Worker APIがありません。");
  log("通知許可を確認します…");
  let p=Notification.permission; log("現在の通知許可: "+p);
  if(p==="default"){p=await Notification.requestPermission();log("通知許可の結果: "+p)}
  if(p!=="granted")throw Error("通知許可がgrantedではありません: "+p);
  const r=await navigator.serviceWorker.register("./sw.js",{scope:"./"});
  await navigator.serviceWorker.ready; log("Service Worker: OK");
let sub=await r.pushManager.getSubscription();
if(sub){
  log("既存のPushSubscriptionを解除します…");
  await sub.unsubscribe();
  sub=null;
}
log("新しいPushSubscriptionを作成します…");
sub=await r.pushManager.subscribe({
  userVisibleOnly:true,
  applicationServerKey:keyBytes(KEY)
});
  localStorage.setItem("pushSubscription",JSON.stringify(sub));
  log("★ プッシュ通知の登録に成功しました！");
 }catch(e){log("ERROR: "+(e&&e.message?e.message:String(e)))}
}
async function localTest(){
 S.textContent="ローカル通知テストを開始します。";
 try{if(!("Notification"in window))throw Error("Notification APIがありません。");let p=Notification.permission;if(p==="default")p=await Notification.requestPermission();if(p!=="granted")throw Error("通知許可がありません: "+p);new Notification("Therapist Monitor",{body:"ローカル通知テストです。"});log("ローカル通知を発行しました。")}catch(e){log("ERROR: "+(e&&e.message?e.message:String(e)))}
}
function copySub(){const x=localStorage.getItem("pushSubscription");if(!x){log("まだPush登録情報がありません。①を先に押してください。");return}navigator.clipboard.writeText(x).then(()=>log("登録情報をコピーしました。"),e=>log("コピー失敗: "+e))}
pushBtn.onclick=regPush;testBtn.onclick=localTest;copyBtn.onclick=copySub;
log("URL: "+location.href);log("画面読み込み完了。");
</script></main></body></html>
